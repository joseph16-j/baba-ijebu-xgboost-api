services:
  - type: web
    name: premier-lotto-xgboost-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn ai_lotto_production_system:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 180
    healthCheckPath: /api/health
    autoDeploy: true
